            const on = answered(n);
            return (
              'flex: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 14px; font-weight: 700; ' +
              (on
                ? 'background: var(--navy); color: var(--navy-fg);'
                : 'background: var(--surface); color: var(--foreground); border: 1px solid var(--field-border);')
            );
          };
          const rowBase = (n) =>
            'scroll-margin: 24px; padding: 10px 12px; border-radius: 10px; ' +
            (s.current === n ? 'background: var(--surface-2);' : '');
          const flagStyle = (n) =>
            'flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid ' +
            (s.flags[n]
              ? 'var(--warning); background: var(--warning); color: var(--warning-fg);'
              : 'transparent; background: transparent; color: var(--muted);');
          const common = (n) => ({
            n,
            id: 'q' + n,
            inputId: 'in' + n,
            labelId: 'lb' + n,
            numStyle: numStyle(n),
            flagged: !!s.flags[n],
            flagLabel:
              (s.flags[n] ? 'Remove flag from question ' : 'Flag question ') +
              n +
              ' for review',
            flagStyle: flagStyle(n),
            flagFill: s.flags[n] ? 'currentColor' : 'none',
            toggleFlag: flag(n),
            rowStyle:
              rowBase(n) + ' display: flex; align-items: center; gap: 12px;',
            rowStyleCol:
              rowBase(n) + ' display: flex; flex-direction: column; gap: 10px;',
          });
          const HEAD = [
            ['i', 'A fashion with uncertain benefits'],
            ['ii', 'An old practice that faded'],
            ['iii', 'Why city honey tastes different'],
            ['iv', 'Longer seasons thanks to new planting'],
            ['v', 'Competition for limited food'],
            ['vi', 'Rules to manage growth'],
            ['vii', 'Rewards beyond honey'],
            ['viii', 'The cost of starting a hive'],
          ];
          const used = Object.values(s.headings);
          const headings = HEAD.map(([key, text]) => ({
            key,
            text,
            used: used.includes(key),
            style:
              'font-size: inherit; ' +
              (used.includes(key) ? 'color: var(--muted);' : ''),
          }));
          const paras = { 1: 'B', 2: 'C', 3: 'D', 4: 'E', 5: 'F' };
          const matchQs = [1, 2, 3, 4, 5].map((n) => ({
            ...common(n),
            para: paras[n],
            value: s.headings[n],
            onChange: (e) =>
              this.setState({
                headings: { ...s.headings, [n]: e.target.value },
                current: n,
              }),
          }));
          const TF = {
            6: 'Urban beekeeping existed before the Second World War.',
            7: 'Wildflower strips cost less to maintain than lawns.',
            8: 'When hive numbers doubled, each colony found more nectar.',
            9: 'Every city council now requires beekeepers to register.',
          };
          const tfQs = [6, 7, 8, 9].map((n) => ({
            ...common(n),
            prompt: TF[n],
            opts: ['TRUE', 'FALSE', 'NOT GIVEN'].map((v, i) => {
              const on = s.tfng[n] === v;
              return {
                label: v,
                on,
                pick: () =>
                  this.setState({ tfng: { ...s.tfng, [n]: v }, current: n }),
                style:
                  'min-width: 104px; height: 40px; padding: 0 14px; border: 0; font-size: 14px; font-weight: 600; ' +
                  (i ? 'border-left: 1px solid var(--field-border); ' : '') +
                  (on
                    ? 'background: var(--accent); color: var(--accent-fg);'
                    : 'background: var(--surface); color: var(--foreground);'),
              };
            }),
          }));
          const TX = {
            10: ['In farmland, a single', 'may bloom for only a few weeks.'],
            11: ['Many wild bees forage within a few', 'their nests.'],
            12: ['Some councils offer beginners free', '.'],
            13: ['Keepers say their hives help them meet their', '.'],
          };
          const textQs = [10, 11, 12, 13].map((n) => {
            const w = words(s.text[n]);
            return {
              ...common(n),
              before: TX[n][0],
              after: TX[n][1],
              value: s.text[n],
              words: w,
              over: w > 2,
              aria: 'Question ' + n + ', no more than two words',
              inputStyle:
                'width: 180px; height: 36px; padding: 0 10px; font-size: inherit; vertical-align: middle;' +
                (w > 2 ? ' border-color: var(--warning);' : ''),
              onChange: (e) =>
                this.setState({
                  text: { ...s.text, [n]: e.target.value },
                  current: n,
                }),
            };
          });
          const nav = Array.from({ length: 13 }, (_, i) => {
            const n = i + 1;
            const a = answered(n);
            const cur = s.current === n;
            const f = !!s.flags[n];
            return {
              n,
              flagged: f,
              go: () => this.go(n),
              ariaCurrent: cur ? 'true' : 'false',
              aria:
                'Question ' +
                n +
                (a ? ', answered' : ', not answered') +
                (f ? ', flagged' : '') +
                (cur ? ', current' : ''),
              style:
                'position: relative; width: 36px; height: 36px; border-radius: 8px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; ' +
                (a
                  ? 'background: var(--navy); color: var(--navy-fg); border: 1px solid var(--navy);'
                  : 'background: var(--surface); color: var(--foreground); border: 1px solid var(--field-border);') +
                (cur
                  ? ' box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--foreground);'
                  : ''),
            };
          });
          const segStyle = (i, px) =>
            'width: 34px; height: 32px; border: 0; border-radius: 6px; font-weight: 700; font-size: ' +
            px +
            'px; ' +
            (s.size === i
              ? 'background: var(--segment); box-shadow: var(--shadow-surface); color: var(--foreground);'
              : 'background: transparent; color: var(--muted);');
          return {
            rootClass: theme === 'dark' ? 'me dark' : 'me',
            split,
            passageStyle:
              'flex: 0 0 ' +
              split +
              '%; min-width: 320px; overflow-y: auto; background: var(--surface);',
            paraStyle:
              'display: flex; flex-direction: column; gap: 20px; font-size: ' +
              sizes[s.size] +
              'px; line-height: 1.7; max-width: 66ch;',
            qWrapStyle:
              'max-width: 760px; margin: 0 auto; padding: 24px 28px 64px; display: flex; flex-direction: column; gap: 28px; font-size: ' +
              qSizes[s.size] +
              'px; line-height: 1.5;',
            size0: s.size === 0,
            size1: s.size === 1,
            size2: s.size === 2,
            sizeStyle0: segStyle(0, 13),
            sizeStyle1: segStyle(1, 16),
            sizeStyle2: segStyle(2, 19),
            sizeSm: () => this.setState({ size: 0 }),
            sizeMd: () => this.setState({ size: 1 }),
            sizeLg: () => this.setState({ size: 2 }),
            headings,
            matchQs,
            tfQs,
            textQs,
            nav,
            answeredCount: nav.filter((b) => answered(b.n)).length,
            g1Done: [1, 2, 3, 4, 5].filter(answered).length,
            g2Done: [6, 7, 8, 9].filter(answered).length,
            g3Done: [10, 11, 12, 13].filter(answered).length,
            prev: () => this.go(s.current - 1),
            next: () => this.go(s.current + 1),
          };
        }
      }
      window.__dcMount(Component);
    </script>
  </body>
</html>
