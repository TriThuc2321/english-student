      ['Cambridge IELTS 17 General Training – Test 1', 'IELTS General', 'Sections', '28 Sep 2026, 21:10', 'Graded', 'L 7.0 · R 6.5'],
      ['Cambridge IELTS 18 – Practice Test 3', 'IELTS Academic', 'Full', '31 Aug 2026, 19:00', 'Graded', '6.0']
    ];
    const rows = R.map(([title, type, mode, started, status, score]) => {
      const resume = status === 'In progress';
      return { title, type, mode, started, score, status: G[status] + status,
        badge: 'display: inline-flex; padding: 2px 8px; border-radius: 4px; font-size: 12px; line-height: 18px; font-weight: 600; white-space: nowrap; ' + B[status],
        action: resume ? 'Resume' : 'View results', href: resume ? 'Main.dc.html' : 'Results.dc.html',
        btn: 'display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; ' +
          (resume ? 'background: var(--accent); color: var(--accent-fg);' : 'background: var(--default); color: var(--foreground); border: 1px solid var(--field-border);') };
    });
    return { rootClass: (this.props.theme ?? 'light') === 'dark' ? 'me dark' : 'me', rows };
  }
}
window.__dcMount(Component);
</script>
