<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'All', query: '' }; }
  renderVals() {
    const s = this.state;
    const view = this.props.view ?? 'results';
    const ICON = {
      Listening: ['M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3', ''],
      Reading: ['M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z', 'M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'],
      Writing: ['M12 20h9', 'M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z'],
      Speaking: ['M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z', 'M19 10v2a7 7 0 0 1-14 0v-2']
    };
    const sk = (pairs) => pairs.map(([name, min]) => ({ name, min, d1: ICON[name][0], d2: ICON[name][1] }));
    const fmt = (m) => (m >= 60 ? Math.floor(m / 60) + 'h ' : '') + (m % 60 ? (m % 60) + 'm' : '').trim();
    const IELTS = [['Listening', 30], ['Reading', 60], ['Writing', 60], ['Speaking', 14]];
    const ALL = [
      ['Cambridge IELTS 18 – Practice Test 1', 'Cambridge IELTS 18', 'IELTS Academic', IELTS, '12 Mar 2024', true],
      ['Cambridge IELTS 18 – Practice Test 2', 'Cambridge IELTS 18', 'IELTS Academic', IELTS, '12 Mar 2024', false],
      ['ETS TOEIC 2024 – Test 3', 'ETS TOEIC 2024', 'TOEIC L&R', [['Listening', 45], ['Reading', 75]], '4 Feb 2024', true],
      ['ETS TOEIC 2024 – Test 4', 'ETS TOEIC 2024', 'TOEIC L&R', [['Listening', 45], ['Reading', 75]], '4 Feb 2024', false],
      ['Cambridge IELTS 17 General Training – Test 1', 'Cambridge IELTS 17', 'IELTS General', [['Listening', 30], ['Reading', 60], ['Writing', 60], ['Speaking', 14]], '20 Nov 2023', false],
      ['TOEIC Speaking & Writing – Test 2', 'ETS TOEIC S&W', 'TOEIC S&W', [['Speaking', 20], ['Writing', 60]], '8 Oct 2023', false],
      ['Cambridge IELTS 18 – Practice Test 3', 'Cambridge IELTS 18', 'IELTS Academic', IELTS, '12 Mar 2024', false],

      total: fmt(skills.reduce((a, b) => a + b[1], 0)) }));
    const q = s.query.trim().toLowerCase();
    const tests = ALL.filter((t) => (s.filter === 'All' || t.type === s.filter) && (!q || (t.title + ' ' + t.source).toLowerCase().includes(q)));
    const chips = ['All', 'IELTS Academic', 'IELTS General', 'TOEIC L&R', 'TOEIC S&W'].map((label) => {
      const on = s.filter === label;
      return { label, on, pick: () => this.setState({ filter: label }),
        style: 'flex: none; height: 40px; padding: 0 16px; border-radius: 9999px; font-size: 14px; font-weight: 600; ' +
          (on ? 'border: 1px solid var(--navy); background: var(--navy); color: var(--navy-fg);' : 'border: 1px solid var(--separator); background: var(--surface); color: var(--foreground);') };
    });

      onQuery: (e) => this.setState({ query: e.target.value }),
      clear: () => this.setState({ query: '', filter: 'All' }),
      countText: 'Showing 1–' + tests.length + ' of ' + (s.filter === 'All' && !q ? 46 : tests.length) + ' tests',
      showGrid: view === 'results' && tests.length > 0, isLoading: view === 'loading',
      isEmpty: view === 'empty' || noRes, isNoResults: noRes,
      emptyTitle: noRes ? 'No tests match your search' : 'No tests yet',
      emptyBody: noRes ? 'Try another title or source, or clear the filters.' : 'New tests are added every month. Check back soon.',
      skeletons: [1, 2, 3, 4, 5, 6]
    };
  }
}
window.__dcMount(Component);
