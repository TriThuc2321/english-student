        --shadow-surface: none;

      .me * {
        box-sizing: border-box;
      }
      .me button,
      .me input {
        font: inherit;
        color: inherit;
      }
      .me button,
      .me label {
        cursor: pointer;
      }
      .me :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .me .ghost:hover {
        background: var(--default);
      }
      .me input[type='checkbox'],
      .me input[type='radio'] {

        width: 18px;
        height: 18px;
        margin: 0;
      }
      .me input[type='range'] {

      }
      .me a {

    <script>
      class Component extends DCLogic {

            ['Listening', 30, '4 parts · 40 questions'],
            ['Reading', 60, '3 passages · 40 questions'],
            ['Writing', 60, '2 tasks'],
            ['Speaking', 14, '3 parts'],

          const sections = SEC.map(([name, min, info]) => {
            const checked = full || !!s.picked[name];
            return {
              name,
              checked,
              locked: full,
              meta: info + ' · ' + min + ' min',
              d1: ICON[name][0],
              d2: ICON[name][1],
              toggle: () =>
                this.setState({

              : 'var(--border); background: var(--surface);');

            rootClass:

            isFull: full,
            isPractice: !full,
            fullStyle: card(full),

            pickFull: () => this.setState({ mode: 'full' }),
