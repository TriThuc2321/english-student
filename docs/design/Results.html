        if (on) el.setAttribute(lname, '');
        continue;
      }
      if (!svg && lname === 'value') { later.push(v == null ? '' : String(v)); continue; }
      if (v === false || v == null) continue;
      el.setAttribute(name === 'className' ? 'class' : name === 'htmlFor' ? 'for' : name, v === true ? 'true' : String(v));
    }
    if (later.length) {
      var val = later[0];
      if (el.tagName === 'TEXTAREA') el.value = val; else { el.setAttribute('value', val); el.value = val; }
    }
  }

  var root, comp, pending = false;
  function allEls() { return root.getElementsByTagName('*'); }
  function render() {
    pending = false;
    var els = allEls(), scrolls = [], focusIdx = -1, sel = null;
    for (var i = 0; i < els.length; i++) {
      if (els[i].scrollTop || els[i].scrollLeft) scrolls.push([i, els[i].scrollTop, els[i].scrollLeft]);
      if (els[i] === document.activeElement) {
        focusIdx = i;
        try { sel = [els[i].selectionStart, els[i].selectionEnd]; } catch (e) { sel = null; }
      }
    }
    var wy = window.scrollY;
    var vals = comp.renderVals ? comp.renderVals() : {};
    var frag = document.createDocumentFragment();
    build(TPL, frag, [vals], false);
    root.replaceChildren(frag);
    els = allEls();
    scrolls.forEach(function (s) { if (els[s[0]]) { els[s[0]].scrollTop = s[1]; els[s[0]].scrollLeft = s[2]; } });
    if (focusIdx >= 0 && els[focusIdx]) {
      els[focusIdx].focus({ preventScroll: true });
      if (sel && sel[0] != null) { try { els[focusIdx].setSelectionRange(sel[0], sel[1]); } catch (e) {} }
    }
    window.scrollTo(0, wy);
  }
  function schedule() { if (!pending && root) { pending = true; Promise.resolve().then(render); } }

  function tweaks(props) {
    var keys = Object.keys(PROPS_DEF).filter(function (k) { return k[0] !== '$' && PROPS_DEF[k] && PROPS_DEF[k].editor; });
    if (!keys.length) return;
    var box = document.createElement('details');
    box.id = 'dc-tweaks';
    box.innerHTML = '<summary>Preview options</summary>';
    var body = document.createElement('div');
    keys.forEach(function (k) {
      var d = PROPS_DEF[k];
      var row = document.createElement('label');
      var span = document.createElement('span'); span.textContent = k; row.appendChild(span);
      var input;
      if (d.editor === 'enum') {
        input = document.createElement('select');
        (d.options || []).forEach(function (o) { var op = document.createElement('option'); op.value = o; op.textContent = o; input.appendChild(op); });
        input.value = props[k];
        input.addEventListener('change', function () { props[k] = input.value; schedule(); });
      } else if (d.editor === 'boolean') {
        input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!props[k];
        input.addEventListener('change', function () { props[k] = input.checked; schedule(); });
      } else if (d.editor === 'range' || d.editor === 'int' || d.editor === 'float') {
        input = document.createElement('input'); input.type = 'range';
        input.min = d.min != null ? d.min : 0; input.max = d.max != null ? d.max : 100; input.step = d.step || 1; input.value = props[k];
        input.addEventListener('input', function () { props[k] = Number(input.value); schedule(); });
      } else {
        input = document.createElement('input'); input.value = props[k] == null ? '' : props[k];
        input.addEventListener('input', function () { props[k] = input.value; schedule(); });
      }
      row.appendChild(input); body.appendChild(row);
    });
    box.appendChild(body);
    var st = document.createElement('style');
    st.textContent = '#dc-tweaks{position:fixed;left:12px;bottom:84px;opacity:.92;z-index:99999;font:13px/1.4 system-ui,sans-serif;background:#fff;color:#222;border:1px solid #ccc;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:260px}#dc-tweaks summary{cursor:pointer;padding:8px 12px;font-weight:600}#dc-tweaks div{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}#dc-tweaks label{display:flex;justify-content:space-between;align-items:center;gap:12px}#dc-tweaks select,#dc-tweaks input{font:inherit}@media print{#dc-tweaks{display:none}}';
    document.head.appendChild(st);
    document.body.appendChild(box);
  }

  window.__dcMount = function (Component) {
    var props = {};
    Object.keys(PROPS_DEF).forEach(function (k) { if (k[0] !== '$' && PROPS_DEF[k] && 'default' in PROPS_DEF[k]) props[k] = PROPS_DEF[k].default; });
    root = document.getElementById('dc-root');
    comp = new Component(props);
    comp.props = props;
    render();
    if (comp.componentDidMount) comp.componentDidMount();
    tweaks(props);
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 14 }; }
  renderVals() {
    const toeic = (this.props.exam ?? 'IELTS') === 'TOEIC';
    const ICON = {
      Listening: ['M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3', ''],
      Reading: ['M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z', 'M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'],
      Writing: ['M12 20h9', 'M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z'],
      Speaking: ['M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z', 'M19 10v2a7 7 0 0 1-14 0v-2']
    };
    const sk = (name, score, raw) => ({ name, score, raw, d1: ICON[name][0], d2: ICON[name][1] });
    const skills = toeic
      ? [sk('Listening', '395', '82 / 100 correct'), sk('Reading', '360', '74 / 100 correct')]
      : [sk('Listening', '7.0', '32 / 40 correct'), sk('Reading', '6.5', '28 / 40 correct'), sk('Writing', '—', 'Grading pending'), sk('Speaking', '—', 'Grading pending')];
    // question results: c correct, x incorrect, b blank
    const pattern = 'ccxccbcxcccxcxccccxcxccbccxcccxcccxccccb';
    const n0 = toeic ? 101 : 1;
    const s0 = this.state.sel;
    const sel = toeic && s0 < 101 ? s0 + 100 : (!toeic && s0 > 100 ? s0 - 100 : s0);
    const grid = pattern.split('').map((r, i) => {
      const n = n0 + i; const on = sel === n;
      const base = 'width: 100%; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 8px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; ';
      const st = r === 'c' ? 'background: var(--success); color: var(--success-fg); border: 1px solid var(--success);'
        : r === 'x' ? 'background: var(--danger-soft); color: var(--foreground); border: 2px solid var(--danger);'
        : 'background: transparent; color: var(--muted); border: 1px dashed var(--field-border);';
      return { n, on, glyph: r === 'c' ? '✓' : r === 'x' ? '✗' : '–',
        aria: 'Question ' + n + ', ' + (r === 'c' ? 'correct' : r === 'x' ? 'incorrect' : 'blank'),
        pick: () => this.setState({ sel: n }),
        style: base + st + (on ? ' box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--foreground);' : '') };
    });
    const count = (ch) => pattern.split('').filter((r) => r === ch).length;
    const bar = (p) => ({ pct: p, bar: 'height: 100%; width: ' + p + '%; border-radius: 9999px; background: var(--navy);' });
    const mk = (label, a, b, weak) => ({ label, raw: a + '/' + b, aria: label + ': ' + a + ' of ' + b + ' correct', weak: !!weak, ...bar(Math.round(a / b * 100)) });
    const parts = toeic
      ? [mk('Part 5 · Incomplete sentences', 24, 30), mk('Part 6 · Text completion', 11, 16), mk('Part 7 · Single passages', 21, 29), mk('Part 7 · Multiple passages', 18, 25)]
      : [mk('Passage 1', 11, 13), mk('Passage 2', 9, 13), mk('Passage 3', 8, 14)];
    const types = toeic
      ? [mk('Grammar', 18, 20), mk('Vocabulary', 6, 10, true), mk('Text completion', 11, 16), mk('Reading comprehension', 39, 54)]
      : [mk('Multiple choice', 8, 10), mk('True / False / Not given', 7, 12, true), mk('Matching headings', 3, 5, true), mk('Sentence completion', 5, 6), mk('Summary completion', 5, 7)];
    const r = pattern[sel - n0] || 'b';
    const prompts = { 14: 'Why did the writer visit the city?' };
    return {
      rootClass: (this.props.theme ?? 'light') === 'dark' ? 'me dark' : 'me',
      expired: this.props.expired ?? true,
      examType: toeic ? 'TOEIC L&R' : 'IELTS Academic',
      title: toeic ? 'ETS TOEIC 2024 – Test 3' : 'Cambridge IELTS 18 – Practice Test 1',
      took: toeic ? '2h 0m' : '2h 30m',
      totalLabel: toeic ? 'Total score' : 'Overall band (estimated)',
      total: toeic ? '755' : '6.5', totalOf: toeic ? '/ 990' : '/ 9',
      totalNote: toeic ? 'Listening 395 + Reading 360' : 'Based on Listening and Reading. Writing and Speaking are graded later.',
      skills, grid, gridSection: toeic ? 'Reading 101–140' : 'Reading',
      nCorrect: count('c'), nWrong: count('x'), nBlank: count('b'), parts, types,
      rvN: sel, rvType: toeic ? 'Incomplete sentences' : (sel <= 13 ? 'Matching headings' : 'Multiple choice'),
      rvPrompt: prompts[sel] || 'Question text from the test appears here.',
      rvAnswer: r === 'b' ? 'No answer' : r === 'x' ? 'B · to study' : 'A · for work',
      rvStatus: r === 'c' ? '✓ Correct' : r === 'x' ? '✗ Incorrect' : '– Blank',
      rvBadgeStyle: 'flex: none; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: 600; ' +
        (r === 'c' ? 'background: var(--success); color: var(--success-fg);' : r === 'x' ? 'background: var(--danger); color: var(--danger-fg);' : 'background: var(--surface-2); color: var(--muted);'),
      rvPrev: () => this.setState({ sel: Math.max(n0, sel - 1) }),
      rvNext: () => this.setState({ sel: Math.min(n0 + 39, sel + 1) })
    };
  }
}
window.__dcMount(Component);
</script>
