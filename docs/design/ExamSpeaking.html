    </script>
    <script>
      /* Minimal standalone runtime for exported MyEnglish design screens. */
      (function () {
        var SVG_NS = 'http://www.w3.org/2000/svg';
        var TPL = window.__DC_TPL__;
        var PROPS_DEF = window.__DC_PROPS__ || {};
        var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
        var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;

        function DCLogic(props) {
          this.props = props || {};
          this.state = {};
        }
        DCLogic.prototype.setState = function (p) {
          var next = typeof p === 'function' ? p(this.state, this.props) : p;
          this.state = Object.assign({}, this.state, next);
          schedule();
        };
        DCLogic.prototype.forceUpdate = function () {
          schedule();
        };
        window.DCLogic = DCLogic;

        function lookup(expr, scope) {
          expr = expr.trim();
          if (expr === 'true') return true;
          if (expr === 'false') return false;
          if (expr === 'null') return null;
          if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
          if (/^(['"]).*\1$/.test(expr)) return expr.slice(1, -1);
          var parts = expr.split('.');
          var cur;
          for (var i = scope.length - 1; i >= 0; i--) {
            if (
              scope[i] &&
              Object.prototype.hasOwnProperty.call(scope[i], parts[0])
            ) {
              cur = scope[i][parts[0]];
              break;
            }
          }
          for (var j = 1; j < parts.length && cur != null; j++)
            cur = cur[parts[j]];
          return cur;
        }
        function resolve(val, scope) {
          var m = WHOLE.exec(val);
          if (m) return lookup(m[1], scope);
          return val.replace(HOLE, function (_, e) {
            var v = lookup(e, scope);
            return v == null ? '' : String(v);
          });
        }

        var BOOL_PROPS = {
          checked: 1,
          disabled: 1,
          readonly: 1,
          selected: 1,
          multiple: 1,
          required: 1,
        };

        function build(nodes, parent, scope, inSvg) {
          for (var i = 0; i < nodes.length; i++) {
            var n = nodes[i];
            if (typeof n === 'string') {
              parent.appendChild(
                document.createTextNode(
                  n.indexOf('{{') < 0
                    ? n
                    : (function () {
                        var v = resolve(n, scope);
                        return v == null ? '' : String(v);
                      })(),
                ),
              );
              continue;
            }
            if (n.n === 'sc-for') {
              var list = resolve(n.a.list || '', scope) || [];
              var as = n.a.as || 'item';
              for (var k = 0; k < list.length; k++) {
                var s = {};
                s[as] = list[k];
                s.$index = k;
                build(n.c, parent, scope.concat([s]), inSvg);
              }
              continue;
            }
            if (n.n === 'sc-if') {
              if (resolve(n.a.value || '', scope))
                build(n.c, parent, scope, inSvg);
              continue;
            }
            var svg = inSvg || n.n === 'svg';
            var el = svg
              ? document.createElementNS(SVG_NS, n.n)
              : document.createElement(n.n);
            build(n.c, el, scope, svg && n.n !== 'foreignObject');
            applyAttrs(el, n.a, scope, svg);
            parent.appendChild(el);
          }
        }

        function applyAttrs(el, attrs, scope, svg) {
          var later = [];
          for (var name in attrs) {
            if (/^hint-/.test(name)) continue;
            var raw = attrs[name];
            var v = raw.indexOf('{{') < 0 ? raw : resolve(raw, scope);
            if (
              /^on[A-Z]/.test(name) ||
              (/^on/.test(name) && typeof v === 'function')
            ) {
              if (typeof v !== 'function') continue;
              var ev = name.slice(2).toLowerCase();
              if (ev === 'change') {
                var tag = el.tagName.toLowerCase();
                var type = (attrs.type || 'text').toLowerCase();
                if (
                  tag === 'textarea' ||
                  (tag === 'input' &&
                    !/^(checkbox|radio|range|file)$/.test(type))
                )
                  ev = 'input';
              }
              el.addEventListener(ev, v);
              continue;
            }
            var lname = name.toLowerCase();
            if (!svg && BOOL_PROPS[lname]) {
              var on = v === '' || v === true || v === 'true' || v === lname;
              if (lname === 'readonly') el.readOnly = on;
              else el[lname] = on;
              if (on) el.setAttribute(lname, '');
              continue;
            }
            if (!svg && lname === 'value') {
              later.push(v == null ? '' : String(v));
              continue;
            }
            if (v === false || v == null) continue;
            el.setAttribute(
              name === 'className'
                ? 'class'
                : name === 'htmlFor'
                  ? 'for'
                  : name,
              v === true ? 'true' : String(v),
            );
          }
          if (later.length) {
            var val = later[0];
            if (el.tagName === 'TEXTAREA') el.value = val;
            else {
              el.setAttribute('value', val);
              el.value = val;
            }
          }
        }

        var root,
          comp,
          pending = false;
        function allEls() {
          return root.getElementsByTagName('*');
        }
        function render() {
          pending = false;
          var els = allEls(),
            scrolls = [],
            focusIdx = -1,
            sel = null;
          for (var i = 0; i < els.length; i++) {
            if (els[i].scrollTop || els[i].scrollLeft)
              scrolls.push([i, els[i].scrollTop, els[i].scrollLeft]);
            if (els[i] === document.activeElement) {
              focusIdx = i;
              try {
                sel = [els[i].selectionStart, els[i].selectionEnd];
              } catch (e) {
                sel = null;
              }
            }
          }
          var wy = window.scrollY;
          var vals = comp.renderVals ? comp.renderVals() : {};
          var frag = document.createDocumentFragment();
          build(TPL, frag, [vals], false);
          root.replaceChildren(frag);
          els = allEls();
          scrolls.forEach(function (s) {
            if (els[s[0]]) {
              els[s[0]].scrollTop = s[1];
              els[s[0]].scrollLeft = s[2];
            }
          });
          if (focusIdx >= 0 && els[focusIdx]) {
            els[focusIdx].focus({ preventScroll: true });
            if (sel && sel[0] != null) {
              try {
                els[focusIdx].setSelectionRange(sel[0], sel[1]);
              } catch (e) {}
            }
          }
          window.scrollTo(0, wy);
        }
        function schedule() {
          if (!pending && root) {
            pending = true;
            Promise.resolve().then(render);
          }
        }

        function tweaks(props) {
          var keys = Object.keys(PROPS_DEF).filter(function (k) {
            return k[0] !== '$' && PROPS_DEF[k] && PROPS_DEF[k].editor;
          });
          if (!keys.length) return;
          var box = document.createElement('details');
          box.id = 'dc-tweaks';
          box.innerHTML = '<summary>Preview options</summary>';
          var body = document.createElement('div');
          keys.forEach(function (k) {
            var d = PROPS_DEF[k];
            var row = document.createElement('label');
            var span = document.createElement('span');
            span.textContent = k;
            row.appendChild(span);
            var input;
            if (d.editor === 'enum') {
              input = document.createElement('select');
              (d.options || []).forEach(function (o) {
                var op = document.createElement('option');
                op.value = o;
                op.textContent = o;
                input.appendChild(op);
              });
              input.value = props[k];
              input.addEventListener('change', function () {
                props[k] = input.value;
                schedule();
              });
            } else if (d.editor === 'boolean') {
              input = document.createElement('input');
              input.type = 'checkbox';
              input.checked = !!props[k];
              input.addEventListener('change', function () {
                props[k] = input.checked;
                schedule();
              });
            } else if (
              d.editor === 'range' ||
              d.editor === 'int' ||
              d.editor === 'float'
            ) {
              input = document.createElement('input');
              input.type = 'range';
              input.min = d.min != null ? d.min : 0;
              input.max = d.max != null ? d.max : 100;
              input.step = d.step || 1;
              input.value = props[k];
              input.addEventListener('input', function () {
                props[k] = Number(input.value);
                schedule();
              });
            } else {
              input = document.createElement('input');
              input.value = props[k] == null ? '' : props[k];
              input.addEventListener('input', function () {
                props[k] = input.value;
                schedule();
              });
            }
            row.appendChild(input);
            body.appendChild(row);
          });
          box.appendChild(body);
          var st = document.createElement('style');
          st.textContent =
            '#dc-tweaks{position:fixed;left:12px;bottom:84px;opacity:.92;z-index:99999;font:13px/1.4 system-ui,sans-serif;background:#fff;color:#222;border:1px solid #ccc;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:260px}#dc-tweaks summary{cursor:pointer;padding:8px 12px;font-weight:600}#dc-tweaks div{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}#dc-tweaks label{display:flex;justify-content:space-between;align-items:center;gap:12px}#dc-tweaks select,#dc-tweaks input{font:inherit}@media print{#dc-tweaks{display:none}}';
          document.head.appendChild(st);
          document.body.appendChild(box);
        }

        window.__dcMount = function (Component) {
          var props = {};
          Object.keys(PROPS_DEF).forEach(function (k) {
            if (k[0] !== '$' && PROPS_DEF[k] && 'default' in PROPS_DEF[k])
              props[k] = PROPS_DEF[k].default;
          });
          root = document.getElementById('dc-root');
          comp = new Component(props);
          comp.props = props;
          render();
          if (comp.componentDidMount) comp.componentDidMount();
          tweaks(props);
        };
      })();
    </script>
    <script>
      class Component extends DCLogic {
        renderVals() {
          const stage = this.props.stage ?? 'record';
          const idx = { prep: 0, record: 1, done: 2 }[stage];
          const steps = ['Prepare · 45s', 'Respond · 30s', 'Done'].map(
            (label, i) => ({
              label,
              current: i === idx ? 'step' : 'false',
              mark: i < idx ? '✓' : String(i + 1),
              style:
                'display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 9999px; ' +
                (i === idx
                  ? 'background: var(--navy-soft); color: var(--navy); font-weight: 600;'
                  : 'color: var(--muted);'),
              dot:
                'width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; font-size: 12px; font-weight: 700; ' +
                (i === idx
                  ? 'background: var(--navy); color: var(--navy-fg);'
                  : i < idx
                    ? 'background: var(--success); color: var(--success-fg);'
                    : 'border: 1px solid var(--field-border);'),
            }),
          );
          const lv = [
            30, 55, 80, 60, 95, 70, 45, 85, 65, 40, 75, 50, 30, 20, 12, 8,
          ];
          const bars = lv.map((h, i) => ({
            style:
              'width: 5px; border-radius: 2px; height: ' +
              h +
              '%; background: ' +
              (i < 11 ? 'var(--success)' : 'var(--surface-3)') +
              ';',
          }));
          const nav = Array.from({ length: 11 }, (_, i) => {
            const n = i + 1;
            const a = n < 3;
            const cur = n === 3;
            return {
              n,
              aria:
                'Question ' +
                n +
                (a ? ', answered' : cur ? ', current' : ', not started'),
              style:
                'width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 14px; font-weight: 600; ' +
                (a
                  ? 'background: var(--navy); color: var(--navy-fg);'
                  : 'border: 1px solid var(--field-border);') +
                (cur
                  ? ' box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--foreground);'
                  : ''),
            };
          });
          return {
            rootClass:
              (this.props.theme ?? 'light') === 'dark' ? 'me dark' : 'me',
            steps,
            bars,
            nav,
            isPrep: stage === 'prep',
            isRec: stage === 'record',
            isDone: stage === 'done',
          };
        }
      }
      window.__dcMount(Component);
    </script>
